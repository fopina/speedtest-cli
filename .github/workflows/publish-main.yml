name: 🚀 publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  goreleaser:
    name: publish
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/release
        id: release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show summary
        run: |
          echo 'Published:  ' >> ${GITHUB_STEP_SUMMARY}
          echo '* `ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}`' >> ${GITHUB_STEP_SUMMARY}
          echo '* `ghcr.io/${{ github.repository }}:latest`' >> ${GITHUB_STEP_SUMMARY}

  bump-homebrew:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: fopina/homebrew-tap@bump-action-v2
        with:
          version: ${{ github.ref_name }}
          token: ${{ secrets.TAP_TOKEN }}
          formula_class: SpeedtestCli
          formula_file: speedtest-cli
          description: CLI for running internet speed tests against speedtest.net and fast.com
          bin: speedtest-cli
          test: |
            assert_match "version:", shell_output("#{bin}/speedtest-cli v")
